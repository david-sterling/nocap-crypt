version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Only bundle minor/patch bumps — a crypto tool can't afford a
      # single PR silently carrying a major/breaking bump to aes,
      # cipher, cbc, sha2, or xts-mode alongside a dozen unrelated
      # updates (see PR #1: this grouped every severity together and
      # the merged diff was Cargo.toml/Cargo.lock only, no source
      # fixes, so it didn't even compile). Majors are left out of the
      # group entirely so each lands as its own reviewable PR.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "cargo"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
